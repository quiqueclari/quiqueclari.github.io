project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - publications/index.qmd
    - workingpapers/index.qmd
    - cv/index.qmd
    - teaching/index.qmd
    - 404.qmd
  resources:
    - /html/fonts/
    - /cv/CV_website.pdf
    - /workingpapers/*.pdf
  preview:
    port: 22222
    browser: true
    watch-inputs: true
    navigate: true

website:
  title: "Quique Clari"
  description: "Political science researcher at the Autonomous University of Madrid, studying Europeans’ attitudes towards democracy."
  site-url: https://quiqueclari.github.io
  image: img/my_image.jpg
  favicon: img/favicon.png
  navbar:
    pinned: true
    background: "#faf9f6"
    foreground: "#253638"
    right:
      - text: "Publications"
        href: publications/index.qmd
      - text: "Research"
        href: workingpapers/index.qmd
      - text: "Teaching"
        href: teaching/index.qmd
      - text: "CV"
        href: cv/index.qmd
  search: false
  page-footer:
    border: false
    left: |
      <span class="footer-name">© 2026 Quique Clari</span>
      <span class="footer-credit">Built with <a href="https://quarto.org/">Quarto</a> · Adapted from <a href="https://www.marvinschmitt.com/blog/website-tutorial-quarto/">Marvin Schmitt’s template</a></span>
    right:
      - text: Google Scholar
        href: https://scholar.google.com/citations?user=f5PXRCsAAAAJ&hl=es
      - text: ORCID
        href: https://orcid.org/0000-0002-2941-0332
      - text: LinkedIn
        href: https://www.linkedin.com/in/enrique-clari-galán-012428124/
      - text: Twitter
        href: https://twitter.com/quiqueclari1

execute:
  freeze: true

format:
  html:
    lang: en
    fontsize: 17px
    theme:
      - cosmo
      - html/styles.scss
    grid:
      body-width: 1080px
      sidebar-width: 0px
      margin-width: 0px
      gutter-width: 1.5rem
    toc: false
    code-link: true
    anchor-sections: false
    include-before-body: html/skip-link.html
    fig-cap-location: margin
    reference-location: margin
    footnotes-hover: true
